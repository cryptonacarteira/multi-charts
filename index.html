<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Analyzer PRO - Multi-Chart</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #06080f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        header { 
            padding: 0 20px; 
            background-color: #131722; 
            border-bottom: 1px solid #2a2e39; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 48px;
            box-sizing: border-box;
        }
        .logo { color: #2962ff; font-weight: 800; font-size: 18px; letter-spacing: 1px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            height: calc(100vh - 48px);
            padding: 2px;
            box-sizing: border-box;
            background-color: #000;
        }
        .chart-box { background: #131722; border: 1px solid #1e222d; position: relative; }
        .login-status { font-size: 11px; color: #4ade80; display: flex; align-items: center; gap: 8px; }
        .dot { height: 8px; width: 8px; background-color: #4ade80; border-radius: 50%; display: inline-block; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .btn-auth { background-color: #2962ff; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ANALYZER PRO</div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="login-status"><span class="dot"></span> AGUARDANDO LOGIN</div>
            <a href="https://www.tradingview.com/chart/" target="_blank" class="btn-auth">FAZER LOGIN</a>
        </div>
    </header>

    <div class="grid-container">
        <div id="chart_1" class="chart-box"></div>
        <div id="chart_2" class="chart-box"></div>
        <div id="chart_3" class="chart-box"></div>
        <div id="chart_4" class="chart-box"></div>
        <div id="chart_5" class="chart-box"></div>
        <div id="chart_6" class="chart-box"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function loadChart(container, symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "America/Sao_Paulo",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "toolbar_bg": "#131722",
                "enable_publishing": false,
                "hide_side_toolbar": false, // ESSENCIAL PARA O PINE
                "allow_symbol_change": true,
                "withdateranges": true,
                "container_id": container,
                "studies": [], 
                "enabled_features": ["study_templates", "header_widget_dom_node"],
                "disabled_features": ["use_localstorage_for_settings_save"],
                "overrides": {
                    "volumePaneSize": "tiny",
                    "paneProperties.background": "#131722",
                    "paneProperties.vertGridProperties.color": "#2a2e39",
                    "paneProperties.horzGridProperties.color": "#2a2e39"
                }
            });
        }

        loadChart("chart_1", "CAPITALCOM:US500");   
        loadChart("chart_2", "CAPITALCOM:US100");   
        loadChart("chart_3", "AMEX:SPY");            
        loadChart("chart_4", "OANDA:XAUUSD");        
        loadChart("chart_5", "NASDAQ:QQQ");          
        loadChart("chart_6", "CBOE:VXX"); 
    </script>
</body>
</html>
