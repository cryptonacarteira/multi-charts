<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Crypto Range - Dashboard </title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background-color: #06080f; color: white; font-family: sans-serif; overflow: hidden; 
        }
        header { 
            height: 40px; background: #131722; border-bottom: 1px solid #2a2e39; 
            display: flex; align-items: center; padding: 0 15px; justify-content: space-between; 
        }
        .grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); 
            height: calc(100vh - 40px); gap: 2px; padding: 2px; background: #000;
        }
        .chart-card { background: #131722; display: flex; flex-direction: column; border: 1px solid #2a2e39; }
        .controls { 
            height: 35px; background: #1c222d; display: flex; align-items: center; 
            padding: 0 8px; gap: 8px; border-bottom: 1px solid #2a2e39; 
        }
        .label { font-size: 10px; font-weight: bold; color: #2962ff; min-width: 65px; text-transform: uppercase; }
        .input-field { 
            flex: 1; background: #06080f; border: 1px solid #363c4e; color: #4ade80; 
            font-size: 10px; padding: 4px; border-radius: 3px; outline: none; 
        }
        .canvas-container { flex: 1; width: 100%; position: relative; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 14px; letter-spacing: 1px;">CRYPTO RANGE <span style="color: #2962ff;">DASHBOARD</span></div>
    <div id="status" style="font-size: 10px; color: #94a3b8;">Status: Online • Market Data</div>
</header>

<div class="grid" id="mainGrid"></div>

<script>
    // Configuração dos Ativos (Símbolos do Yahoo/Google Finance)
    const config = [
        { id: 'c1', name: 'S&P 500', symbol: '^GSPC' },
        { id: 'c2', name: 'NASDAQ 100', symbol: '^IXIC' },
        { id: 'c3', name: 'BITCOIN', symbol: 'BTC-USD' },
        { id: 'c4', name: 'OURO (GOLD)', symbol: 'GC=F' },
        { id: 'c5', name: 'SPY (ETF)', symbol: 'SPY' },
        { id: 'c6', name: 'VIX INDEX', symbol: '^VIX' }
    ];

    const charts = {};

    async function loadRealData(symbol, series, chart) {
        try {
            // Usando o Proxy para buscar dados do Yahoo Finance (mesma fonte do Google Finance para web)
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1h&range=7d`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
            
            const response = await fetch(proxyUrl);
            const json = await response.json();
            const result = json.chart.result[0];
            const quote = result.indicators.quote[0];
            const timestamps = result.timestamp;

            const formattedData = timestamps.map((ts, i) => ({
                time: ts,
                open: quote.open[i] || quote.close[i-1],
                high: quote.high[i] || quote.close[i-1],
                low: quote.low[i] || quote.close[i-1],
                close: quote.close[i]
            })).filter(d => d.open !== null && d.close !== null);

            series.setData(formattedData);
            chart.timeScale().fitContent();
        } catch (e) {
            console.warn(`Erro ao carregar ${symbol}. Verifique a conexão.`);
        }
    }

    function init() {
        const grid = document.getElementById('mainGrid');
        config.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'chart-card';
            card.innerHTML = `
                <div class="controls">
                    <span class="label">${item.name}</span>
                    <input type="text" id="input-${item.id}" class="input-field" placeholder="Legenda, Preço, Legenda, Preço..." oninput="updateLevels('${item.id}')">
                </div>
                <div id="canvas-${item.id}" class="canvas-container"></div>
            `;
            grid.appendChild(card);

            const container = document.getElementById(`canvas-${item.id}`);
            const chart = LightweightCharts.createChart(container, { 
                layout: { textColor: '#d1d4dc', background: { type: 'solid', color: '#131722' } },
                grid: { vertLines: { color: '#1f222d' }, horzLines: { color: '#1f222d' } },
                timeScale: { borderColor: '#2a2e39', timeVisible: true }
            });

            const series = chart.addCandlestickSeries({ 
                upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' 
            });

            charts[item.id] = { chart, series, priceLines: [] };
            loadRealData(item.symbol, series, chart);

            // Carrega o que foi salvo no navegador
            const saved = localStorage.getItem(`range-save-${item.id}`);
            if(saved) {
                document.getElementById(`input-${item.id}`).value = saved;
                updateLevels(item.id);
            }

            // Garante que o gráfico se ajuste ao tamanho da tela
            new ResizeObserver(() => {
                chart.resize(container.clientWidth, container.clientHeight);
                chart.timeScale().fitContent();
            }).observe(container);
        });
    }

    function updateLevels(id) {
        const val = document.getElementById(`input-${id}`).value;
        localStorage.setItem(`range-save-${id}`, val);
        const obj = charts[id];
        if(!obj) return;
        
        // Limpa as linhas anteriores para desenhar as novas
        obj.priceLines.forEach(l => obj.series.removePriceLine(l));
        obj.priceLines = [];
        
        const parts = val.split(',');
        for (let i = 0; i < parts.length; i += 2) {
            const label = parts[i]?.trim();
            const price = parseFloat(parts[i+1]);
            if (!isNaN(price)) {
                const line = obj.series.createPriceLine({
                    price: price, 
                    color: '#2962ff', 
                    lineWidth: 2, 
                    axisLabelVisible: true, 
                    title: label,
                    lineStyle: 0 // Solid
                });
                obj.priceLines.push(line);
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
