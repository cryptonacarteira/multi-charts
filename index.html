<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Crypto Range - Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background-color: #06080f; color: white; font-family: sans-serif; overflow: hidden; 
        }
        .header { height: 40px; background: #131722; border-bottom: 1px solid #2a2e39; display: flex; align-items: center; padding: 0 15px; }
        .grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); 
            height: calc(100vh - 40px); gap: 2px; padding: 2px; background: #000;
        }
        .chart-card { background: #131722; display: flex; flex-direction: column; border: 1px solid #2a2e39; }
        .controls { height: 35px; background: #1c222d; display: flex; align-items: center; padding: 0 8px; gap: 10px; border-bottom: 1px solid #2a2e39; }
        .label { font-size: 10px; font-weight: bold; color: #2962ff; min-width: 50px; }
        .input-field { flex: 1; background: #06080f; border: 1px solid #363c4e; color: #4ade80; font-size: 10px; padding: 4px; border-radius: 3px; }
        .canvas-container { flex: 1; width: 100%; position: relative; }
    </style>
</head>
<body>

<div class="header">
    <span style="font-weight: bold;">CRYPTO RANGE <span style="color: #2962ff;">DASHBOARD</span></span>
</div>

<div class="grid">
    <div class="chart-card"><div class="controls"><span class="label">SPX 500</span><input type="text" id="in-1" class="input-field" oninput="drawLines('1')"></div><div id="graph-1" class="canvas-container"></div></div>
    <div class="chart-card"><div class="controls"><span class="label">NASDAQ</span><input type="text" id="in-2" class="input-field" oninput="drawLines('2')"></div><div id="graph-2" class="canvas-container"></div></div>
    <div class="chart-card"><div class="controls"><span class="label">SPY</span><input type="text" id="in-3" class="input-field" oninput="drawLines('3')"></div><div id="graph-3" class="canvas-container"></div></div>
    <div class="chart-card"><div class="controls"><span class="label">GOLD</span><input type="text" id="in-4" class="input-field" oninput="drawLines('4')"></div><div id="graph-4" class="canvas-container"></div></div>
    <div class="chart-card"><div class="controls"><span class="label">BITCOIN</span><input type="text" id="in-5" class="input-field" oninput="drawLines('5')"></div><div id="graph-5" class="canvas-container"></div></div>
    <div class="chart-card"><div class="controls"><span class="label">VIX</span><input type="text" id="in-6" class="input-field" oninput="drawLines('6')"></div><div id="graph-6" class="canvas-container"></div></div>
</div>

<script>
    const state = {};
    const ids = ['1', '2', '3', '4', '5', '6'];

    function start() {
        // Verifica se a biblioteca carregou, se não, tenta o segundo link (CDNJS)
        if (typeof LightweightCharts === 'undefined') {
            const script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.1/lightweight-charts.standalone.production.js";
            script.onload = build;
            document.head.appendChild(script);
        } else {
            build();
        }
    }

    function build() {
        ids.forEach(id => {
            const container = document.getElementById(`graph-${id}`);
            
            const chart = LightweightCharts.createChart(container, {
                width: container.offsetWidth,
                height: container.offsetHeight,
                layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1f222d' }, horzLines: { color: '#1f222d' } },
                timeScale: { borderColor: '#2a2e39' },
                priceScale: { borderColor: '#2a2e39' }
            });

            const series = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
            });

            // Gerar 60 velas de amostra para visualizar
            const sampleData = [];
            let date = new Date();
            date.setDate(date.getDate() - 60);
            for(let i=0; i<60; i++) {
                sampleData.push({
                    time: date.toISOString().split('T')[0],
                    open: 100 + i, high: 105 + i, low: 95 + i, close: 102 + i
                });
                date.setDate(date.getDate() + 1);
            }
            series.setData(sampleData);
            chart.timeScale().fitContent();

            state[id] = { chart, series, activeLines: [] };

            // Carregar histórico
            const history = localStorage.getItem(`data-v2-${id}`);
            if(history) {
                document.getElementById(`in-${id}`).value = history;
                drawLines(id);
            }
        });
    }

    function drawLines(id) {
        const inputStr = document.getElementById(`in-${id}`).value;
        localStorage.setItem(`data-v2-${id}`, inputStr);
        
        const current = state[id];
        if(!current) return;

        // Limpar linhas
        current.activeLines.forEach(l => current.series.removePriceLine(l));
        current.activeLines = [];

        const parts = inputStr.split(',');
        for (let i = 0; i < parts.length; i += 2) {
            const name = parts[i]?.trim();
            const val = parseFloat(parts[i+1]);
            if (!isNaN(val)) {
                const line = current.series.createPriceLine({
                    price: val, 
                    color: '#2962ff', 
                    lineWidth: 1, 
                    axisLabelVisible: true, 
                    title: name,
                    lineStyle: 0 // Solid
                });
                current.activeLines.push(line);
            }
        }
    }

    // Inicialização com pequeno delay para garantir que o layout CSS estabilizou
    window.addEventListener('load', () => setTimeout(start, 500));

    // Ajuste de redimensionamento
    window.addEventListener('resize', () => {
        ids.forEach(id => {
            const container = document.getElementById(`graph-${id}`);
            if(state[id]) state[id].chart.resize(container.offsetWidth, container.offsetHeight);
        });
    });
</script>
</body>
</html>
