<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Crypto Range - Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            background-color: #06080f !important; 
            color: white; 
            font-family: sans-serif; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
        }
        header { 
            height: 45px; 
            background: #131722; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            border-bottom: 1px solid #2a2e39; 
            box-sizing: border-box;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(2, 1fr); 
            height: calc(100vh - 45px); 
            gap: 2px; 
            padding: 2px; 
            box-sizing: border-box;
        }
        .chart-container { 
            background: #131722; 
            border: 1px solid #2a2e39; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }
        .chart-header { 
            height: 35px;
            padding: 0 8px; 
            background: #1c222d; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            border-bottom: 1px solid #2a2e39;
        }
        .chart-header span { font-size: 11px; font-weight: bold; color: #2962ff; min-width: 60px; }
        .chart-header input { 
            flex: 1; 
            background: #06080f; 
            border: 1px solid #363c4e; 
            color: #4ade80; 
            font-size: 10px; 
            padding: 4px; 
            border-radius: 3px;
        }
        .canvas-area { 
            flex: 1; 
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold;">CRYPTO RANGE <span style="color: #2962ff;">DASHBOARD</span></div>
</header>

<div class="grid" id="mainGrid">
    <div class="chart-container"><div class="chart-header"><span>SPX 500</span><input type="text" id="input-c1" oninput="processData('c1')"></div><div id="canvas-c1" class="canvas-area"></div></div>
    <div class="chart-container"><div class="chart-header"><span>NASDAQ</span><input type="text" id="input-c2" oninput="processData('c2')"></div><div id="canvas-c2" class="canvas-area"></div></div>
    <div class="chart-container"><div class="chart-header"><span>SPY</span><input type="text" id="input-c3" oninput="processData('c3')"></div><div id="canvas-c3" class="canvas-area"></div></div>
    <div class="chart-container"><div class="chart-header"><span>GOLD</span><input type="text" id="input-c4" oninput="processData('c4')"></div><div id="canvas-c4" class="canvas-area"></div></div>
    <div class="chart-container"><div class="chart-header"><span>BITCOIN</span><input type="text" id="input-c5" oninput="processData('c5')"></div><div id="canvas-c5" class="canvas-area"></div></div>
    <div class="chart-container"><div class="chart-header"><span>VIX</span><input type="text" id="input-c6" oninput="processData('c6')"></div><div id="canvas-c6" class="canvas-area"></div></div>
</div>

<script>
    const chartObjects = {};
    const ids = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6'];

    function init() {
        ids.forEach(id => {
            const container = document.getElementById(`canvas-${id}`);
            const chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1f222d' }, horzLines: { color: '#1f222d' } },
            });

            const series = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
            });

            // Gerar 100 velas de exemplo
            const data = [];
            let t = new Date();
            t.setDate(t.getDate() - 100);
            for(let i=0; i<100; i++) {
                data.push({
                    time: t.toISOString().split('T')[0],
                    open: 100 + Math.random()*2, high: 105, low: 95, close: 100 + Math.random()*2
                });
                t.setDate(t.getDate() + 1);
            }
            series.setData(data);
            chart.timeScale().fitContent();

            chartObjects[id] = { chart, series, lines: [] };

            // Carregar dados salvos
            const saved = localStorage.getItem(`data-${id}`);
            if(saved) {
                document.getElementById(`input-${id}`).value = saved;
                processData(id);
            }
        });
    }

    function processData(id) {
        const raw = document.getElementById(`input-${id}`).value;
        localStorage.setItem(`data-${id}`, raw);
        const obj = chartObjects[id];
        const parts = raw.split(',');

        obj.lines.forEach(l => obj.series.removePriceLine(l));
        obj.lines = [];

        for (let i = 0; i < parts.length; i += 2) {
            const label = parts[i]?.trim();
            const price = parseFloat(parts[i+1]);
            if (!isNaN(price)) {
                const line = obj.series.createPriceLine({
                    price: price, color: '#2962ff', lineWidth: 1, axisLabelVisible: true, title: label,
                });
                obj.lines.push(line);
            }
        }
    }

    // Aguarda um pouco para o navegador calcular o tamanho das divs
    window.onload = () => setTimeout(init, 300);

    window.onresize = () => {
        ids.forEach(id => {
            const container = document.getElementById(`canvas-${id}`);
            if(chartObjects[id]) {
                chartObjects[id].chart.resize(container.clientWidth, container.clientHeight);
            }
        });
    };
</script>
</body>
</html>
