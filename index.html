<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Levels - Dashboard PRO</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #06080f; color: #ffffff; font-family: sans-serif; overflow: hidden; }
        header { 
            padding: 0 20px; 
            background-color: #131722; 
            border-bottom: 1px solid #2a2e39; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 45px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            height: calc(100vh - 45px);
            padding: 2px;
            box-sizing: border-box;
        }
        .chart-box { background: #131722; border: 1px solid #2a2e39; }
        .logo { color: #2962ff; font-weight: bold; font-size: 16px; }
        .instruction { font-size: 11px; color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ANALYZER PRO</div>
        <div class="instruction">Cole seu código no PINE EDITOR (botão inferior) de cada gráfico</div>
    </header>

    <div class="grid-container">
        <div id="c1" class="chart-box"></div>
        <div id="c2" class="chart-box"></div>
        <div id="c3" class="chart-box"></div>
        <div id="c4" class="chart-box"></div>
        <div id="c5" class="chart-box"></div>
        <div id="c6" class="chart-box"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function loadFullToolChart(id, symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "America/Sao_Paulo",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "toolbar_bg": "#131722",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": id,
                /* LIBERA TODAS AS FERRAMENTAS INCLUINDO PINE EDITOR */
                "enabled_features": [
                    "study_templates", 
                    "header_layouttoggle",
                    "pinescript_editor_v5",
                    "use_localstorage_for_settings_save"
                ],
                "studies": [],
                "overrides": {
                    "volumePaneSize": "tiny"
                }
            });
        }

        loadFullToolChart("c1", "CAPITALCOM:US500");   
        loadFullToolChart("c2", "CAPITALCOM:US100");   
        loadFullToolChart("c3", "AMEX:SPY");            
        loadFullToolChart("c4", "OANDA:XAUUSD");        
        loadFullToolChart("c5", "NASDAQ:QQQ");          
        loadFullToolChart("c6", "CBOE:VXX"); 
    </script>
</body>
</html>
