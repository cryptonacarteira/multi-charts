<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Charts - Cripto & Stocks</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #06080f; color: #ffffff; font-family: sans-serif; overflow: hidden; }
        header { 
            padding: 10px 20px; 
            background-color: #131722; 
            border-bottom: 1px solid #2a2e39; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            height: 40px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 5px;
            height: calc(100vh - 60px);
            padding: 5px;
            box-sizing: border-box;
        }
        .chart-box {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 4px;
        }
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; overflow-y: auto; }
            .chart-box { height: 450px; }
        }
    </style>
</head>
<body>

    <header>
        <div style="color: #2962ff; font-weight: bold; font-size: 18px;">MULTI_ANALIZER PRO</div>
        <div style="font-size: 11px; color: #4ade80; border: 1px solid #4ade80; padding: 2px 8px; border-radius: 4px;">LIVE WEB</div>
    </header>

    <div class="grid-container">
        <div class="chart-box" id="chart_left"></div>
        <div class="chart-box" id="chart_right"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function loadChart(id, symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "America/Sao_Paulo",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": id,
                "studies": [
                    "RSI@tv-basicstudies",
                    "MASimple@tv-basicstudies"
                ]
            });
        }
        loadChart("chart_left", "AMEX:SPY");
        loadChart("chart_right", "BINANCE:BTCUSDT");
    </script>
</body>
</html>
