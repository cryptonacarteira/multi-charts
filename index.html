<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Range - Multi Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; background: #06080f; color: white; font-family: sans-serif; overflow: hidden; }
        header { 
            height: 45px; background: #131722; display: flex; align-items: center; 
            padding: 0 20px; border-bottom: 1px solid #2a2e39; justify-content: space-between;
        }
        .grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); 
            height: calc(100vh - 45px); gap: 2px; padding: 2px; box-sizing: border-box; 
        }
        .chart-container { background: #131722; border: 1px solid #2a2e39; display: flex; flex-direction: column; }
        .chart-header { 
            padding: 6px; background: #1c222d; display: flex; align-items: center; gap: 8px; 
            border-bottom: 1px solid #2a2e39;
        }
        .chart-header span { font-size: 11px; font-weight: bold; color: #2962ff; min-width: 70px; text-transform: uppercase; }
        .chart-header input { 
            flex: 1; background: #06080f; border: 1px solid #363c4e; color: #4ade80; 
            font-size: 10px; padding: 4px; border-radius: 3px; outline: none;
        }
        .chart-header input:focus { border-color: #2962ff; }
        .canvas-area { flex: 1; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; color: #fff; letter-spacing: 1px;">CRYPTO RANGE <span style="color: #2962ff;">DASHBOARD</span></div>
    <div style="font-size: 10px; color: #94a3b8; font-style: italic;">Independente • Sem Bloqueios</div>
</header>

<div class="grid" id="mainGrid"></div>

<script>
    // LISTA DE GRÁFICOS - Você pode mudar os nomes abaixo:
    const config = [
        { id: 'c1', name: 'SPX 500' },
        { id: 'c2', name: 'NASDAQ' },
        { id: 'c3', name: 'SPY' },
        { id: 'c4', name: 'GOLD / XAU' },
        { id: 'c5', name: 'BITCOIN' },
        { id: 'c6', name: 'US 10Y / VIX' }
    ];

    const chartObjects = {};

    function init() {
        const grid = document.getElementById('mainGrid');
        
        config.forEach(item => {
            const container = document.createElement('div');
            container.className = 'chart-container';
            container.innerHTML = `
                <div class="chart-header">
                    <span>${item.name}</span>
                    <input type="text" id="input-${item.id}" placeholder="Cole os dados aqui..." oninput="processData('${item.id}')">
                </div>
                <div class="canvas-area" id="canvas-${item.id}"></div>
            `;
            grid.appendChild(container);

            const chart = LightweightCharts.createChart(document.getElementById(`canvas-${item.id}`), {
                layout: { backgroundColor: '#131722', textColor: '#d1d4dc', fontSize: 10 },
                grid: { vertLines: { color: '#1f222d' }, horzLines: { color: '#1f222d' } },
                timeScale: { borderColor: '#2a2e39', timeVisible: true },
                priceScale: { borderColor: '#2a2e39' },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
            });

            const series = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
            });

            // Dados temporários para o gráfico não ficar vazio
            const mockData = [];
            let t = new Date();
            t.setDate(t.getDate() - 100);
            let p = 100;
            for(let i=0; i<100; i++) {
                let change = (Math.random() - 0.5) * 2;
                let open = p;
                let close = p + change;
                mockData.push({
                    time: t.toISOString().split('T')[0],
                    open: open, high: Math.max(open, close) + 0.5, low: Math.min(open, close) - 0.5, close: close
                });
                p = close;
                t.setDate(t.getDate() + 1);
            }
            series.setData(mockData);
            chart.timeScale().fitContent();

            chartObjects[item.id] = { chart, series, lines: [] };

            // Recupera o que foi colado antes
            const savedData = localStorage.getItem(`range-data-${item.id}`);
            if(savedData) {
                document.getElementById(`input-${item.id}`).value = savedData;
                processData(item.id);
            }
        });
    }

    function processData(id) {
        const rawText = document.getElementById(`input-${id}`).value;
        localStorage.setItem(`range-data-${id}`, rawText); 
        
        const obj = chartObjects[id];
        const segments = rawText.split(',');

        // Remove linhas antigas
        obj.lines.forEach(l => obj.series.removePriceLine(l));
        obj.lines = [];

        // Lógica: "Texto, Preço, Texto, Preço"
        for (let i = 0; i < segments.length; i += 2) {
            const labelText = segments[i]?.trim();
            const priceValue = parseFloat(segments[i+1]);

            if (!isNaN(priceValue)) {
                const priceLine = obj.series.createPriceLine({
                    price: priceValue,
                    color: '#2962ff',
                    lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Solid,
                    axisLabelVisible: true,
                    title: labelText,
                });
                obj.lines.push(priceLine);
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
