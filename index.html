<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Crypto Range - Injeção Direta</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #06080f; color: #ffffff; font-family: sans-serif; overflow: hidden; }
        header { 
            padding: 0 20px; 
            background-color: #131722; 
            border-bottom: 1px solid #2a2e39; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 45px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            height: calc(100vh - 45px);
            padding: 2px;
            box-sizing: border-box;
        }
        .chart-box { background: #131722; border: 1px solid #2a2e39; }
        .logo { color: #2962ff; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">CRYPTO-RANGE PRO</div>
        <div style="font-size: 11px; color: #4ade80;">MODO: MANUAL SCRIPT INJECTION</div>
    </header>

    <div class="grid-container">
        <div id="c1" class="chart-box"></div>
        <div id="c2" class="chart-box"></div>
        <div id="c3" class="chart-box"></div>
        <div id="c4" class="chart-box"></div>
        <div id="c5" class="chart-box"></div>
        <div id="c6" class="chart-box"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function loadChart(id, symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "toolbar_bg": "#131722",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": id,
                "withdateranges": true,
                /* TENTATIVA DE FORÇAR O PINE EDITOR NO WIDGET */
                "enabled_features": ["pinescript_editor_v5", "study_templates"],
                "overrides": { "volumePaneSize": "tiny" }
            });
        }

        loadChart("c1", "CAPITALCOM:US500");   
        loadChart("c2", "CAPITALCOM:US100");   
        loadChart("c3", "AMEX:SPY");            
        loadChart("c4", "OANDA:XAUUSD");        
        loadChart("c5", "NASDAQ:QQQ");          
        loadChart("c6", "CBOE:VXX"); 
    </script>
</body>
</html>
