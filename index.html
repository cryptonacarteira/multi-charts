<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Crypto Range - Dashboard PRO</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #06080f; color: #ffffff; font-family: sans-serif; overflow: hidden; }
        .grid-container {
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(2, 1fr);
            gap: 2px; 
            height: 100vh; 
            padding: 2px; 
            box-sizing: border-box;
        }
        .chart-box { background: #131722; border: 1px solid #2a2e39; }
    </style>
</head>
<body>

    <div class="grid-container">
        <div id="c1" class="chart-box"></div>
        <div id="c2" class="chart-box"></div>
        <div id="c3" class="chart-box"></div>
        <div id="c4" class="chart-box"></div>
        <div id="c5" class="chart-box"></div>
        <div id="c6" class="chart-box"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function loadChart(id, symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "toolbar_bg": "#131722",
                "container_id": id,
                "hide_top_toolbar": false,     // GARANTE QUE O FX APAREÇA
                "hide_side_toolbar": false,    // MOSTRA BARRA LATERAL DE DESENHO
                "withdateranges": true,
                "allow_symbol_change": true,
                "save_image": false,
                "enabled_features": ["study_templates"],
                "studies": []
            });
        }

        loadChart("c1", "CAPITALCOM:US500"); loadChart("c2", "CAPITALCOM:US100");
        loadChart("c3", "AMEX:SPY"); loadChart("c4", "OANDA:XAUUSD");
        loadChart("c5", "NASDAQ:QQQ"); loadChart("c6", "CBOE:VXX");
    </script>
</body>
</html>
